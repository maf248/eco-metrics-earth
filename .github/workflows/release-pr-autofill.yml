# Fills the title and description of a release PR (develop to main) when it is opened or reopened.
# It overwrites both every time and only reads git history: it never deploys, pushes or tags, and it
# is not a required check. Plain `pull_request` (never `pull_request_target`), limited to PRs from
# `develop` of this repository, so no untrusted code runs with write access.
name: Release PR autofill

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  autofill:
    name: Fill title and description
    if: github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-pr-autofill-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # No credentials are persisted: the job never pushes, and the token reaches only the step that
      # edits the PR, never `npm ci` or the script.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main
        run: git fetch origin main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compute title and description
        run: node scripts/release-pr-autofill.mjs --out-dir "$RUNNER_TEMP/release-pr"

      - name: Apply to the pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            -F title=@"$RUNNER_TEMP/release-pr/title.txt" \
            -F body=@"$RUNNER_TEMP/release-pr/body.md"
