name: Deploy API

# Runs only after CI has passed (called from ci.yml, jobs `deploy-api-production`
# and `deploy-api-development`) or when dispatched manually. A manual dispatch
# always deploys the dispatched ref and skips change detection. Production only
# deploys from `main`; dispatching `development` from a branch is how edits to
# this workflow are tested before they are merged.
on:
  workflow_call:
    inputs:
      target:
        description: 'Deploy target: production (eco-metrics-api) or development (eco-metrics-api-dev)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - development
          - production
        default: development

jobs:
  deploy:
    name: Build and deploy API to Cloud Run (${{ inputs.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Literal prefix on purpose: `github.workflow` would resolve to the caller's
    # workflow name when this file is called from ci.yml. A running deploy is
    # never cancelled; at most one run per target waits (a newer waiting run
    # replaces an older one, which is safe because change detection diffs
    # against the serving SHA). Different targets never wait on each other.
    concurrency:
      group: deploy-api-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so change detection can diff against the deployed SHA.
          fetch-depth: 0

      # Single place where a target maps to its service and CORS variables.
      # Bash `case` instead of `a && b || c` expressions: an empty optional
      # variable would make such an expression fall through to the wrong value.
      - name: Resolve deploy target and pre-flight checks
        id: target
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          REF: ${{ github.ref }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          CORS_ORIGIN_PATTERN: ${{ vars.CORS_ORIGIN_PATTERN }}
          CORS_ORIGIN_DEV: ${{ vars.CORS_ORIGIN_DEV }}
          CORS_ORIGIN_PATTERN_DEV: ${{ vars.CORS_ORIGIN_PATTERN_DEV }}
        run: |
          case "$DEPLOY_TARGET" in
            production)
              service="eco-metrics-api"
              origin_var="CORS_ORIGIN"
              pattern_var="CORS_ORIGIN_PATTERN"
              ;;
            development)
              service="eco-metrics-api-dev"
              origin_var="CORS_ORIGIN_DEV"
              pattern_var="CORS_ORIGIN_PATTERN_DEV"
              ;;
            *)
              echo "Unknown deploy target '$DEPLOY_TARGET' (expected 'production' or 'development')."
              exit 1
              ;;
          esac

          if [ "$DEPLOY_TARGET" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "Production deploys only from main (got $REF). Dispatch 'development' to test from this ref."
            exit 1
          fi

          missing=()
          for name in GCP_PROJECT_ID GCP_REGION WIF_PROVIDER WIF_SERVICE_ACCOUNT "$origin_var"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required GitHub variables: ${missing[*]}"
            echo "Set them at Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          {
            echo "service=$service"
            echo "origin=${!origin_var}"
            echo "pattern=${!pattern_var}"
          } >> "$GITHUB_OUTPUT"

          echo "Deploy target: $DEPLOY_TARGET → service $service (CORS from $origin_var / $pattern_var)."
          echo "All required GitHub variables are set."

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Decides whether the image inputs changed since the revision that is
      # serving. Diffing against the deployed SHA (not HEAD~1) covers commits
      # whose CI run was cancelled and self-heals after a failed deploy. Any
      # doubt falls back to deploying; a skipped deploy is never the fail-safe.
      - name: Detect api-affecting changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_TARGET: ${{ inputs.target }}
          SERVICE: ${{ steps.target.outputs.service }}
          TARGET_SHA: ${{ github.sha }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          # Same list the former `paths:` filter used (root files match exactly).
          PATTERN='^(apps/api/|packages/shared/)|^(Dockerfile|\.dockerignore|package\.json|package-lock\.json|\.npmrc|\.nvmrc|nx\.json|tsconfig\.base\.json|tsconfig\.json)$|^\.github/workflows/deploy-api\.yml$'
          deployed_sha=""
          matched=""

          decide() {
            echo "deploy=$1" >> "$GITHUB_OUTPUT"
            echo "Deploy target: $DEPLOY_TARGET (service $SERVICE)"
            echo "Deployed SHA: ${deployed_sha:-unknown}"
            echo "Target SHA:   $TARGET_SHA"
            echo "Matched files: ${matched:-none}"
            echo "Decision: deploy=$1 ($2)"
            {
              echo "### API change detection"
              echo "- Deploy target: \`$DEPLOY_TARGET\` (service \`$SERVICE\`)"
              echo "- Deployed SHA: \`${deployed_sha:-unknown}\`"
              echo "- Target SHA: \`$TARGET_SHA\`"
              echo "- Matched files: $(printf '%s' "${matched:-none}" | tr '\n' ' ')"
              echo "- Decision: **deploy=$1** ($2)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            decide true "manual dispatch"
          fi

          if ! image=$(gcloud run services describe "$SERVICE" \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" \
            --format='value(spec.template.spec.containers[0].image)') || [ -z "$image" ]; then
            decide true "could not read the serving image"
          fi

          deployed_sha="${image##*:}"
          if ! [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            decide true "serving image tag is not a commit SHA"
          fi

          if ! git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null; then
            decide true "deployed SHA is not in the repository history"
          fi

          if ! changed=$(git diff --name-only "$deployed_sha" "$TARGET_SHA"); then
            decide true "git diff failed"
          fi

          matched=$(printf '%s\n' "$changed" | grep -E "$PATTERN" || true)
          if [ -n "$matched" ]; then
            decide true "API inputs changed"
          fi
          decide false "no API inputs changed since the deployed revision"

      - name: Login to Artifact Registry
        if: steps.detect.outputs.deploy == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push container image
        if: steps.detect.outputs.deploy == 'true'
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eco-metrics/api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Prepare CORS env values for deploy-cloudrun
        if: steps.detect.outputs.deploy == 'true'
        id: cors
        env:
          CORS_ORIGIN: ${{ steps.target.outputs.origin }}
          CORS_ORIGIN_PATTERN: ${{ steps.target.outputs.pattern }}
        run: |
          escape() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//,/\\,}"
            printf '%s' "$value"
          }
          {
            echo "origin=$(escape "$CORS_ORIGIN")"
            if [ -n "$CORS_ORIGIN_PATTERN" ]; then
              echo "pattern=CORS_ORIGIN_PATTERN=$(escape "$CORS_ORIGIN_PATTERN")"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        if: steps.detect.outputs.deploy == 'true'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ steps.target.outputs.service }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eco-metrics/api:${{ github.sha }}
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          env_vars: |
            NODE_ENV=production
            CORS_ORIGIN=${{ steps.cors.outputs.origin }}
            SWAGGER_ENABLED=false
            TRUST_PROXY_HOPS=1
            ${{ steps.cors.outputs.pattern }}
          secrets: |
            INTERNAL_API_KEY=internal-api-key:latest
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --cpu=1
            --memory=512Mi
            --startup-probe=httpGet.path=/api/v1/health,httpGet.port=8080,periodSeconds=2,timeoutSeconds=2,failureThreshold=15

      - name: Show deployed URL
        if: steps.detect.outputs.deploy == 'true'
        run: echo "Deployed API URL ${{ steps.deploy.outputs.url }}"
