name: Deploy API

on:
  push:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.nvmrc'
      - 'nx.json'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy API to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pre-flight checks
        run: |
          missing=()
          [ -z "${{ vars.GCP_PROJECT_ID }}" ] && missing+=("GCP_PROJECT_ID")
          [ -z "${{ vars.GCP_REGION }}" ] && missing+=("GCP_REGION")
          [ -z "${{ vars.WIF_PROVIDER }}" ] && missing+=("WIF_PROVIDER")
          [ -z "${{ vars.WIF_SERVICE_ACCOUNT }}" ] && missing+=("WIF_SERVICE_ACCOUNT")
          [ -z "${{ vars.CORS_ORIGIN }}" ] && missing+=("CORS_ORIGIN")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required GitHub variables: ${missing[*]}"
            echo "Set them at Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          echo "All required GitHub variables are set."

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push container image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eco-metrics/api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Prepare CORS env values for deploy-cloudrun
        id: cors
        env:
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          CORS_ORIGIN_PATTERN: ${{ vars.CORS_ORIGIN_PATTERN }}
        run: |
          escape() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//,/\\,}"
            printf '%s' "$value"
          }
          {
            echo "origin=$(escape "$CORS_ORIGIN")"
            if [ -n "$CORS_ORIGIN_PATTERN" ]; then
              echo "pattern=CORS_ORIGIN_PATTERN=$(escape "$CORS_ORIGIN_PATTERN")"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: eco-metrics-api
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/eco-metrics/api:${{ github.sha }}
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          env_vars: |
            NODE_ENV=production
            CORS_ORIGIN=${{ steps.cors.outputs.origin }}
            SWAGGER_ENABLED=false
            TRUST_PROXY_HOPS=1
            ${{ steps.cors.outputs.pattern }}
          secrets: |
            INTERNAL_API_KEY=internal-api-key:latest
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --cpu=1
            --memory=512Mi
            --startup-probe=httpGet.path=/api/v1/health,httpGet.port=8080,periodSeconds=2,timeoutSeconds=2,failureThreshold=15

      - name: Show deployed URL
        run: echo "Deployed API URL ${{ steps.deploy.outputs.url }}"
