name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # CONTRACT: this exact name is selected in Vercel Deployment Checks and the
    # `deploy-api-*` jobs depend on this job. It is also the CI_CHECK_NAME the
    # E2E gate below looks up on the base commit. Do not rename it without
    # updating Vercel (see docs/deploy/vercel.md) and CI_CHECK_NAME.
    name: Format, Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block; `checks: read`
    # lets the E2E gate read the check runs of the base commit.
    permissions:
      contents: read
      checks: read
    # A full run takes ~7 min; fail fast on a hung step instead of GitHub's 6 h default.
    timeout-minutes: 30
    # Official Playwright image: ships Node, all browsers and all OS
    # dependencies, so the job never touches `apt` or downloads browsers
    # (the Ubuntu mirror has hung runs before). The tag must be a literal here
    # because `env` is not available in `container.image`; keep it equal to the
    # installed `@playwright/test` version (enforced by the guard step below).
    # `--ipc=host` avoids Chromium shared-memory crashes; `--init` reaps the
    # processes spawned by the E2E dev-server wrapper.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    # GitHub sets HOME=/github/home in containers; Playwright's CI guide
    # requires HOME=/root for Firefox.
    env:
      HOME: /root
    # A newer push to the same ref supersedes the running check. Runs on `main`
    # are never cancelled so every merged commit keeps a complete CI record.
    # Scoped to this job (not the workflow) so a newer push never cancels a
    # deploy that is already running.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails fast, naming the tag to use, when the container image version
      # differs from the installed @playwright/test (Dependabot does not
      # update `container.image`). Needs node_modules, hence after npm ci.
      - name: Verify Playwright image matches @playwright/test
        run: node scripts/check-playwright-image.mjs

      # Runs before Build/Test so generated artifacts are never in the glob.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Guards the API image: the production install in the Docker build runs
      # `npm ci` from the pruned lockfile, which fails if it is inconsistent.
      - name: Verify API production install (pruned lockfile)
        run: npx nx run api:prune

      - name: Verify API production install (npm ci dry run)
        working-directory: apps/api/dist
        run: npm ci --omit=dev --ignore-scripts --dry-run

      - name: Test
        run: npm run test

      # Decides whether E2E is redundant: docs-only diff AND a green CI check
      # on the base commit. The job and every other step always run; an error
      # or any doubt leaves the output unset or false, so E2E runs.
      - name: Decide whether E2E can be skipped
        id: e2e_gate
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          # Must equal the job `name` above (the CONTRACT comment); `job.name`
          # is not available in expression contexts.
          CI_CHECK_NAME: Format, Lint, Typecheck, Build & Test
        run: node scripts/detect-e2e-skip.cjs

      # Browsers and OS dependencies come from the container image.
      - name: E2E
        if: steps.e2e_gate.outputs.skip_e2e != 'true'
        timeout-minutes: 20
        run: npm run e2e

  # Builds the API image with the production Dockerfile, without publishing it,
  # so a broken image fails here instead of at deploy time. Separate from `ci`:
  # that job runs in the Playwright container, which has no Docker daemon.
  # Gating is step-level on purpose: a job skipped by a job-level `if` would
  # also skip the `deploy-api-*` jobs that need it.
  api-image:
    name: Build API image (no push)
    runs-on: ubuntu-latest
    # A cold build takes a few minutes; fail fast on a hung step.
    timeout-minutes: 15
    permissions:
      contents: read
    # Same policy as `ci`: a newer push supersedes the running check, except on `main`.
    concurrency:
      group: ${{ github.workflow }}-api-image-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect api image changes
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/detect-api-image-changes.sh

      - name: Set up Docker Buildx
        if: steps.detect.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build API image (no push)
        if: steps.detect.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Populate the layer cache only; no image is exported anywhere.
          outputs: type=cacheonly
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

  # Production follows `main`, like the web app on Vercel; `develop` feeds the
  # dev service that Vercel previews consume. Both deploy only after CI passes.
  deploy-api-production:
    name: Deploy API (production)
    needs: [ci, api-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: production

  deploy-api-development:
    name: Deploy API (development)
    needs: [ci, api-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: development
