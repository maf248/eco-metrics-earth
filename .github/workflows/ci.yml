name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  # `checks` and the `e2e` shards run in parallel, so a run lasts as long as the
  # slowest of them; the gate job `ci` concludes from both. Standard runners are
  # free on public repositories; on a private one each shard would bill minutes.
  checks:
    name: 'Checks: format, lint, typecheck, build & unit tests'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A full run takes ~3 min; fail fast on a hung step instead of GitHub's 6 h default.
    timeout-minutes: 20
    # Official Playwright image: ships Node, all browsers and all OS
    # dependencies, so no job touches `apt` or downloads browsers (the Ubuntu
    # mirror has hung runs before). Declared once here and reused by `e2e`
    # through the alias. The tag must be a literal because `env` is not
    # available in `container.image`; keep it equal to the installed
    # `@playwright/test` version (enforced by the guard step below).
    # `--ipc=host` avoids Chromium shared-memory crashes; `--init` reaps the
    # processes spawned by the E2E dev-server wrapper.
    container: &playwright-container
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --init --ipc=host
    # GitHub sets HOME=/github/home in containers; Playwright's CI guide
    # requires HOME=/root for Firefox.
    env:
      HOME: /root
    # A newer push to the same ref supersedes the running check. Runs on `main`
    # are never cancelled so every merged commit keeps a complete CI record.
    # Scoped to this job (not the workflow) so a newer push never cancels a
    # deploy that is already running.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails fast, naming the tag to use, when the container image version
      # differs from the installed @playwright/test (Dependabot does not
      # update `container.image`). Needs node_modules, hence after npm ci.
      - name: Verify Playwright image matches @playwright/test
        run: node scripts/check-playwright-image.mjs

      # Runs before Build/Test so generated artifacts are never in the glob.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Guards the API image: the production install in the Docker build runs
      # `npm ci` from the pruned lockfile, which fails if it is inconsistent.
      - name: Verify API production install (pruned lockfile)
        run: npx nx run api:prune

      - name: Verify API production install (npm ci dry run)
        working-directory: apps/api/dist
        run: npm ci --omit=dev --ignore-scripts --dry-run

      - name: Test
        run: npm run test

  # Playwright shards, in parallel with `checks` (not after it: waiting would
  # add its ~3 min to every green run). Playwright splits by test count; the
  # shard count is the matrix length alone. Revisit it when the slowest shard
  # passes ~6 min. Nothing is uploaded: each shard's log lists its tests.
  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # `checks: read` lets the E2E gate read the check runs of the base commit.
    permissions:
      contents: read
      checks: read
    timeout-minutes: 20
    strategy:
      # One failing shard must not hide the failures of the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container: *playwright-container
    env:
      HOME: /root
    # Same policy as `checks`. The shard is part of the key: a shared group
    # would make the shards of one run cancel each other.
    concurrency:
      group: ${{ github.workflow }}-e2e-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The job runs as root in the container while the runner user owns the
      # workspace, so git refuses it ("dubious ownership") once checkout drops
      # its temporary safe.directory entry. The E2E gate reads git history, so
      # trust the workspace in the job's own global config (HOME=/root).
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Decides whether E2E is redundant: docs-only diff AND a green CI check
      # on the base commit. The job always runs and reports; an error or any
      # doubt leaves the output unset or false, so E2E runs. The detector has
      # no dependencies, so it runs before `npm ci` and a skip saves both.
      - name: Decide whether E2E can be skipped
        id: e2e_gate
        env:
          # Push-only workflow: `before` is the previous tip (all zeros on a new
          # branch); the detector treats a zero or unknown base as doubt and runs E2E.
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          # Must equal the gate job's `name` (the CONTRACT comment below);
          # `job.name` is not available in expression contexts.
          CI_CHECK_NAME: Format, Lint, Typecheck, Build & Test
        run: node scripts/detect-e2e-skip.cjs

      - name: Install dependencies
        if: steps.e2e_gate.outputs.skip_e2e != 'true'
        run: npm ci

      # Browsers and OS dependencies come from the container image.
      - name: E2E
        if: steps.e2e_gate.outputs.skip_e2e != 'true'
        timeout-minutes: 15
        run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  ci:
    # CONTRACT: this exact name is selected in Vercel Deployment Checks and the
    # `deploy-api-*` jobs depend on this job. It is also the CI_CHECK_NAME the
    # E2E gate above looks up on the base commit. Do not rename it without
    # updating Vercel (see docs/deploy/vercel.md) and CI_CHECK_NAME.
    name: Format, Lint, Typecheck, Build & Test
    # The gate verifies nothing itself: it succeeds only when `checks` and
    # every E2E shard succeeded. `always()` makes it report after a failure.
    # Off `main`, a run superseded by a newer push (its jobs cancelled) skips
    # the gate instead of failing it. On `main` it always runs, so production
    # is never released by a skipped check.
    needs: [checks, e2e]
    if: ${{ always() && (github.ref == 'refs/heads/main' || !contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "checks: $CHECKS_RESULT"
          echo "e2e: $E2E_RESULT"
          if [ "$CHECKS_RESULT" != 'success' ] || [ "$E2E_RESULT" != 'success' ]; then
            echo '::error::A verification job did not succeed (see the results above).'
            exit 1
          fi

  # Builds the API image with the production Dockerfile, without publishing it,
  # so a broken image fails here instead of at deploy time. Separate from the
  # verification jobs: the Playwright container has no Docker daemon.
  # Gating is step-level on purpose: a job skipped by a job-level `if` would
  # also skip the `deploy-api-*` jobs that need it.
  api-image:
    name: Build API image (no push)
    runs-on: ubuntu-latest
    # A cold build takes a few minutes; fail fast on a hung step.
    timeout-minutes: 15
    permissions:
      contents: read
    # Same policy as `checks`: a newer push supersedes the running check, except on `main`.
    concurrency:
      group: ${{ github.workflow }}-api-image-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect api image changes
        id: detect
        env:
          # Push-only workflow: `before` is the previous tip (all zeros on a new
          # branch); the script treats a zero or unknown base as doubt and builds.
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/detect-api-image-changes.sh

      - name: Set up Docker Buildx
        if: steps.detect.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build API image (no push)
        if: steps.detect.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Populate the layer cache only; no image is exported anywhere.
          outputs: type=cacheonly
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

  # Production follows `main`, like the web app on Vercel; `develop` feeds the
  # dev service that Vercel previews consume. Both deploy only after CI passes.
  #
  # Contract with Vercel Deployment Checks: the `name` below is the first half of the
  # check `Deploy API (production) / Build and deploy API to Cloud Run (production)`;
  # the second half is the `deploy` job name in deploy-api.yml. Renaming or moving this
  # job, or changing `target`, breaks the web production gate. See docs/deploy/vercel.md.
  deploy-api-production:
    name: Deploy API (production)
    needs: [ci, api-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: production

  deploy-api-development:
    name: Deploy API (development)
    needs: [ci, api-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: development
