name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # CONTRACT: this exact name is selected in Vercel Deployment Checks and the
    # `deploy-api` job depends on this job. Do not rename it without updating
    # Vercel (see docs/deploy/vercel.md).
    name: Format, Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    # A newer push to the same ref supersedes the running check. Runs on `main`
    # are never cancelled so every merged commit keeps a complete CI record.
    # Scoped to this job (not the workflow) so a newer push never cancels a
    # deploy that is already running.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs before Build/Test so generated artifacts are never in the glob.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Guards the API image: the production install in the Docker build runs
      # `npm ci` from the pruned lockfile, which fails if it is inconsistent.
      - name: Verify API production install (pruned lockfile)
        run: npx nx run api:prune

      - name: Verify API production install (npm ci dry run)
        working-directory: apps/api/dist
        run: npm ci --omit=dev --ignore-scripts --dry-run

      - name: Test
        run: npm run test

      # Browsers are not cached on purpose: Playwright's CI guide notes that
      # restoring the cache takes about as long as downloading the binaries,
      # and the OS dependencies must be installed on every run anyway.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E
        run: npm run e2e

  deploy-api:
    name: Deploy API
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
