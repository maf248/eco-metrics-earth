name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref supersedes the running check. Runs on `main`
# are never cancelled so every merged commit keeps a complete CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Format, Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs before Build/Test so generated artifacts are never in the glob.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Browsers are not cached on purpose: Playwright's CI guide notes that
      # restoring the cache takes about as long as downloading the binaries,
      # and the OS dependencies must be installed on every run anyway.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E
        run: npm run e2e
