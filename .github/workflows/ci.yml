name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # CONTRACT: this exact name is selected in Vercel Deployment Checks and the
    # `deploy-api-*` jobs depend on this job. Do not rename it without updating
    # Vercel (see docs/deploy/vercel.md).
    name: Format, Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    # A full run takes ~7 min; fail fast on a hung step instead of GitHub's 6 h default.
    timeout-minutes: 30
    # Official Playwright image: ships Node, all browsers and all OS
    # dependencies, so the job never touches `apt` or downloads browsers
    # (the Ubuntu mirror has hung runs before). The tag must be a literal here
    # because `env` is not available in `container.image`; keep it equal to the
    # installed `@playwright/test` version (enforced by the guard step below).
    # `--ipc=host` avoids Chromium shared-memory crashes; `--init` reaps the
    # processes spawned by the E2E dev-server wrapper.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    # GitHub sets HOME=/github/home in containers; Playwright's CI guide
    # requires HOME=/root for Firefox.
    env:
      HOME: /root
    # A newer push to the same ref supersedes the running check. Runs on `main`
    # are never cancelled so every merged commit keeps a complete CI record.
    # Scoped to this job (not the workflow) so a newer push never cancels a
    # deploy that is already running.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails fast, naming the tag to use, when the container image version
      # differs from the installed @playwright/test (Dependabot does not
      # update `container.image`). Needs node_modules, hence after npm ci.
      - name: Verify Playwright image matches @playwright/test
        run: node scripts/check-playwright-image.mjs

      # Runs before Build/Test so generated artifacts are never in the glob.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Guards the API image: the production install in the Docker build runs
      # `npm ci` from the pruned lockfile, which fails if it is inconsistent.
      - name: Verify API production install (pruned lockfile)
        run: npx nx run api:prune

      - name: Verify API production install (npm ci dry run)
        working-directory: apps/api/dist
        run: npm ci --omit=dev --ignore-scripts --dry-run

      - name: Test
        run: npm run test

      # Browsers and OS dependencies come from the container image.
      - name: E2E
        timeout-minutes: 20
        run: npm run e2e

  # Production follows `main`, like the web app on Vercel; `develop` feeds the
  # dev service that Vercel previews consume. Both deploy only after CI passes.
  deploy-api-production:
    name: Deploy API (production)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: production

  deploy-api-development:
    name: Deploy API (development)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
    with:
      target: development
