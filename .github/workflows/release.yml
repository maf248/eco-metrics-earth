name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Releases push tags, changelogs and a back-merge; two overlapping runs would race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Release root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Release web
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Release api
        working-directory: apps/api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Sync lockfile versions after releases
        run: node scripts/sync-lockfile-versions.mjs

      - name: Commit lockfile sync
        run: |
          if ! git diff --quiet package-lock.json; then
            git add package-lock.json
            git commit -m "chore(release): sync lockfile versions [skip ci]"
            git push origin main
          fi

      - name: Back-merge main into develop
        if: success()
        run: |
          git fetch origin main develop
          git checkout develop
          git merge origin/main -m "chore: back-merge main into develop [skip ci]"
          git push origin develop
